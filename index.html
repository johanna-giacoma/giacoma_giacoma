<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>giacoma_giacoma</title>
<style>
  :root { --paper:#f2f0e7; --ink:#111111; --muted:#464641; --rule:#cfcbc0; }
  @media (prefers-color-scheme: dark) {
    :root { --paper:#1b1b1a; --ink:#ece9e1; --muted:#9a9890; --rule:#3a3935; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
         font-family:Verdana,Geneva,sans-serif; font-size:15px; line-height:1.6; }
  a { color:inherit; }
  .page { max-width:1000px; margin:0 auto; padding:24px 20px 60px; }

  header { text-align:center; padding-bottom:14px; }
  header h1 { font-weight:400;
              font-size:clamp(2rem,7vw,3.6rem); margin:0; }
  header p { margin:6px 0 0; color:var(--muted); font-size:.85rem; }

  .dateline { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;
              padding:8px 0; font-size:.85rem; color:var(--muted); }
  nav { display:flex; gap:18px; flex-wrap:wrap; justify-content:center;
        padding:10px 0; }
  nav button { font:inherit; background:none; border:0; color:var(--muted); cursor:pointer;
               padding:2px 0; }
  nav button:hover { color:var(--ink); }
  nav button[aria-pressed="true"] { color:var(--ink); font-weight:700; }
  nav button:focus-visible { outline:2px solid var(--ink); outline-offset:3px; }

  figure { margin:0 0 10px; }
  img { display:block; width:100%; height:auto; filter:grayscale(1); }
  figcaption { font-size:.75rem; color:var(--muted); margin-top:4px; }

  .lead { padding:28px 0; }
  .lead h2 { font-size:clamp(1.8rem,5vw,3rem); line-height:1.15; margin:0 0 10px; }
  .lead p { font-size:1.1rem; max-width:70ch; }

  .columns { column-count:3; column-gap:32px; padding-top:24px; }
  article { break-inside:avoid; margin-bottom:28px; }
  article h3 { font-size:1.2rem; line-height:1.25; margin:0 0 4px; }
  .meta { font-size:.8rem; color:var(--muted); font-style:italic; margin:0 0 8px; }
  article p { margin:0 0 6px; hyphens:auto; }
  .empty { padding:40px 0; color:var(--muted); text-align:center; }

  footer { margin-top:20px; padding-top:12px;
           text-align:center; font-size:.8rem; color:var(--muted); }

  @media (max-width:800px){ .columns{column-count:2;} }
  @media (max-width:520px){ .columns{column-count:1;} }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>giacoma_giacoma</h1>
    <p>Architecture - Social Design - Creation</p>
  </header>
  <div class="dateline"><span id="date"></span><span>Paris, France</span></div>
  <nav id="nav" aria-label="Sections"></nav>

  <section class="lead" id="lead"></section>
  <section class="columns" id="stories"></section>

  <footer>&copy; Johanna Messner · <a href="mailto:johanna.messner@icloud.com">johanna.messner@icloud.com</a></footer>
</div>

<script>
  // ✏️ EDIT HERE. One entry per project. The first entry is the front-page headline.
  // section: "Architecture" | "Social Design" | "Creation"
  // image:   optional, e.g. "images/project1.jpg" (upload the file to your repo)
  // link:    optional, link to the full project or a video
  const works = [
    {
      title: "fortezza",
      section: "Architecture",
      year: 2023,
      text: "Two or three sentences about the project: the site, the idea, who it is for, the materials.",
      image: "",
      caption: "",
      link: ""
    }
  ];

  // --- You don't need to touch anything below ---
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const sections = ["All", ...new Set(works.map(w => w.section))];
  let current = "All";

  const fig = w => w.image
    ? `<figure><img src="${esc(w.image)}" alt="${esc(w.title)}" loading="lazy">${w.caption ? `<figcaption>${esc(w.caption)}</figcaption>` : ""}</figure>` : "";
  const more = w => w.link ? `<p><a href="${esc(w.link)}" target="_blank" rel="noopener">Read or watch more</a></p>` : "";
  const meta = w => `${esc(w.section)}, ${esc(w.year)}`;

  function render() {
    const list = current === "All" ? works : works.filter(w => w.section === current);
    document.querySelectorAll("#nav button").forEach(b => b.setAttribute("aria-pressed", b.textContent === current));
    const lead = document.getElementById("lead"), stories = document.getElementById("stories");
    if (!list.length) { lead.innerHTML = ""; stories.innerHTML = '<p class="empty">Nothing here yet.</p>'; return; }
    const [first, ...rest] = list;
    lead.innerHTML = `${fig(first)}<h2>${esc(first.title)}</h2><p class="meta">${meta(first)}</p><p>${esc(first.text)}</p>${more(first)}`;
    stories.innerHTML = rest.map(w =>
      `<article>${fig(w)}<h3>${esc(w.title)}</h3><p class="meta">${meta(w)}</p><p>${esc(w.text)}</p>${more(w)}</article>`).join("");
  }

  document.getElementById("nav").innerHTML = sections.map(s => `<button type="button">${esc(s)}</button>`).join("");
  document.getElementById("nav").addEventListener("click", e => {
    if (e.target.tagName === "BUTTON") { current = e.target.textContent; render(); }
  });

  document.getElementById("date").textContent =
    new Date().toLocaleDateString("en-GB", { weekday:"long", year:"numeric", month:"long", day:"numeric" });
  render();
</script>
</body>
</html>
